<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Home Fund</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="https://cdn.plaid.com/link/v2/stable/link-initialize.js"></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <main id="login" class="login" hidden>
    <form id="login-form" class="card login-card">
      <h1>Home Fund</h1>
      <p class="muted">Sign in to see the family budget.</p>
      <label>Email<input type="email" name="email" autocomplete="username" required></label>
      <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
      <button class="btn primary" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app" hidden>
    <header class="topbar">
      <div class="brand">Home Fund</div>
      <nav class="tabs" id="tabs">
        <button data-tab="overview" class="active">Overview</button>
        <button data-tab="transactions">Transactions</button>
        <button data-tab="bills">Bills</button>
        <button data-tab="goal">Home Goal</button>
        <button data-tab="accounts">Accounts</button>
      </nav>
      <div class="topbar-right">
        <span id="sync-status" class="muted small"></span>
        <button id="refresh-btn" class="btn ghost small" title="Reload data">Reload</button>
        <button id="signout-btn" class="btn ghost small">Sign out</button>
      </div>
    </header>
    <section id="view" class="view"></section>
  </div>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
